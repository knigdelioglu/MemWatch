name: Patch visible cleanup entry

on:
  push:
    branches:
      - fix-visible-cleanup-entry
    paths:
      - '.github/workflows/patch-cleanup-entry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Patch MemWatch cleanup entry point
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('MemWatchApp.swift')
          source = path.read_text()

          replacements = [
              (
                  'rootView: SmartMenuBarRootView(monitor: monitor)\n                .frame(width: Self.panelSize.width, height: Self.panelSize.height)',
                  '''rootView: SmartMenuBarRootView(\n                monitor: monitor,\n                openCleanup: { [weak self] in\n                    self?.openCleanupWindow()\n                }\n            )\n                .frame(width: Self.panelSize.width, height: Self.panelSize.height)'''
              ),
              (
                  'title: "Deep Cleanup…",\n            action: #selector(openCleanupWindow),',
                  'title: "Cleanup & Storage…",\n            action: #selector(openCleanupWindow),'
              ),
              (
                  'accessibilityDescription: "Deep Cleanup"',
                  'accessibilityDescription: "Cleanup & Storage"'
              ),
              (
                  'private struct SmartMenuBarRootView: View {\n    @ObservedObject var monitor: MonitoringService\n    @State private var showingTechnicalDetails = false',
                  'private struct SmartMenuBarRootView: View {\n    @ObservedObject var monitor: MonitoringService\n    let openCleanup: () -> Void\n    @State private var showingTechnicalDetails = false'
              ),
              (
                  '                quickFactsCard\n                topConsumersCard\n                controlsRow',
                  '                quickFactsCard\n                cleanupCard\n                topConsumersCard\n                controlsRow'
              ),
              (
                  '    private var topConsumersCard: some View {',
                  '''    private var cleanupCard: some View {\n        Button(action: openCleanup) {\n            HStack(spacing: 12) {\n                ZStack {\n                    Circle()\n                        .fill(Color.accentColor.opacity(0.12))\n                        .frame(width: 38, height: 38)\n                    Image(systemName: "sparkles")\n                        .font(.system(size: 16, weight: .semibold))\n                        .foregroundStyle(Color.accentColor)\n                }\n\n                VStack(alignment: .leading, spacing: 3) {\n                    Text("Cleanup & Storage")\n                        .font(.subheadline.weight(.semibold))\n                    Text("Scan caches, developer files, duplicates, large items and system cleanup")\n                        .font(.caption)\n                        .foregroundStyle(.secondary)\n                        .multilineTextAlignment(.leading)\n                }\n\n                Spacer(minLength: 8)\n\n                Image(systemName: "chevron.right")\n                    .font(.caption.weight(.semibold))\n                    .foregroundStyle(.secondary)\n            }\n            .padding(15)\n            .contentShape(Rectangle())\n        }\n        .buttonStyle(.plain)\n        .background(\n            Color.accentColor.opacity(0.07),\n            in: RoundedRectangle(cornerRadius: 17, style: .continuous)\n        )\n        .overlay {\n            RoundedRectangle(cornerRadius: 17, style: .continuous)\n                .stroke(Color.accentColor.opacity(0.22), lineWidth: 1)\n        }\n        .help("Open Cleanup & Storage")\n    }\n\n    private var topConsumersCard: some View {'''
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected patch anchor not found: {old[:100]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MemWatchApp.swift
          git commit -m "fix: expose Cleanup in the main tray UI"
          git push origin HEAD:${GITHUB_REF_NAME}
