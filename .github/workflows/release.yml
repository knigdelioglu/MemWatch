name: Release Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-trigger-v0.1.9'

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build universal Release DMG
        run: |
          chmod +x Scripts/package_release.sh
          Scripts/package_release.sh

      - name: Inspect package
        run: |
          ls -lh dist/MemWatch.dmg dist/MemWatch.dmg.sha256
          cat dist/MemWatch.dmg.sha256

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemWatch-macOS-ad-hoc
          path: |
            dist/MemWatch.dmg
            dist/MemWatch.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.9"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          MemWatch v0.1.9 adds an AlDente-style live power dashboard and richer AppleSmartBattery telemetry.

          Changes in v0.1.9:
          - Added separate live Adapter Input, Mac Load, and Battery Flow watt readings
          - Added AlDente-style Sankey/ribbon power-flow visualization
          - Distinguishes charging, battery discharge, and adapter + battery assist scenarios
          - Uses AppleSmartBattery PowerTelemetryData when available, with safe derived fallbacks
          - Keeps adapter rated capacity separate from actual live input power
          - Added 5 / 15 / 30 minute multi-series power history
          - Added voltage, current, source, and telemetry-quality details
          - Added power-balance tests, collector smoke coverage, and bounded 30-minute history validation
          - Preserves the existing 5-second monitoring cadence

          Note: Input power is device-side DC power reported by macOS telemetry, not exact wall-socket AC consumption. Exact mains draw requires an external power meter.

          This build is ad-hoc signed and has not yet been Apple-notarized. macOS Gatekeeper may require explicit approval on first launch.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/MemWatch.dmg dist/MemWatch.dmg.sha256 --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "MemWatch $TAG — Release Candidate" \
              --notes-file /tmp/release-notes.md \
              --prerelease \
              dist/MemWatch.dmg \
              dist/MemWatch.dmg.sha256
          fi
