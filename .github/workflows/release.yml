name: Release Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-trigger-v0.1.11'

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build universal Release DMG
        run: |
          chmod +x Scripts/package_release.sh
          Scripts/package_release.sh

      - name: Inspect package
        run: |
          ls -lh dist/MemWatch.dmg dist/MemWatch.dmg.sha256
          cat dist/MemWatch.dmg.sha256

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemWatch-macOS-ad-hoc
          path: |
            dist/MemWatch.dmg
            dist/MemWatch.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.11"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          MemWatch v0.1.11 makes Power Flow live, proportional, and standby-aware.

          Changes in v0.1.11:
          - Tiny adapter input during battery discharge is now shown as adapter connected/standby instead of implying meaningful adapter contribution
          - Example: ~0.53 W adapter input with ~11 W battery discharge reads Battery → Mac · Adapter connected
          - Removed the previous 18% minimum ribbon-share clamp
          - Power-flow ribbon thickness now follows the live watt ratio directly, so sub-watt input stays very thin while higher input grows visibly thicker
          - Added smooth live ribbon geometry transitions as watt values change
          - Added a dedicated 1-second power sample loop while the Power Flow card is visible for AlDente-like responsiveness
          - Kept the normal background/history monitoring cadence at 5 seconds
          - Preserved the existing 5 / 15 / 30 minute power history and AppleSmartBattery telemetry details

          Note: Input power is device-side DC power reported by macOS telemetry, not exact wall-socket AC consumption. Exact mains draw requires an external power meter.

          This build is ad-hoc signed and has not yet been Apple-notarized. macOS Gatekeeper may require explicit approval on first launch.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/MemWatch.dmg dist/MemWatch.dmg.sha256 --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "MemWatch $TAG — Release Candidate" \
              --notes-file /tmp/release-notes.md \
              --prerelease \
              dist/MemWatch.dmg \
              dist/MemWatch.dmg.sha256
          fi
