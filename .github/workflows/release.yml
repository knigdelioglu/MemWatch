name: Release Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-trigger-v0.1.16'

permissions:
  contents: write

env:
  DEFAULT_RELEASE_TAG: v0.1.16

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build universal Release DMG
        run: |
          chmod +x Scripts/package_release.sh
          Scripts/package_release.sh

      - name: Inspect package
        run: |
          ls -lh dist/MemWatch.dmg dist/MemWatch.dmg.sha256
          cat dist/MemWatch.dmg.sha256

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemWatch-macOS-ad-hoc
          path: |
            dist/MemWatch.dmg
            dist/MemWatch.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${DEFAULT_RELEASE_TAG}"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          MemWatch v0.1.16 folds AmbientSync into the main MemWatch application and hardens the merged display runtime.

          Changes:
          - AmbientSync display features now live inside the single MemWatch menu-bar app, lifecycle and settings experience
          - Display runtime activation is gated by successful legacy AmbientSync cleanup to avoid dual display controllers
          - Mutable display state is split into focused brightness, volume, diagnostics and HiDPI runtime owners
          - Private display symbols are resolved and cached outside the hot path
          - m1ddc availability can refresh safely at runtime without probing on every display tick
          - HiDPI callback registration/unregistration now has explicit idempotent lifecycle handling
          - Keep Awake disable semantics and display capability degradation paths are hardened
          - Complete Swift strict-concurrency checking is enabled for the app and helper targets
          - Existing memory, swap, storage, power, notification and Cleanup functionality remains integrated under the shared scheduler
          - macOS CI covers the app build, Display smoke/architecture checks, memory/storage/power tests, Cleanup safety/cancellation tests, helper contracts and release packaging

          This build is ad-hoc signed and has not yet been Apple-notarized. macOS Gatekeeper may require explicit approval on first launch.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/MemWatch.dmg dist/MemWatch.dmg.sha256 --clobber
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "MemWatch $TAG — AmbientSync Birleşimi ve Display Hardening" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "MemWatch $TAG — AmbientSync Birleşimi ve Display Hardening" \
              --notes-file /tmp/release-notes.md \
              --prerelease \
              dist/MemWatch.dmg \
              dist/MemWatch.dmg.sha256
          fi

      - name: Prune previous GitHub releases once
        if: github.ref_type != 'tag' && contains(github.event.head_commit.message, '[prune-releases]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TAG="${DEFAULT_RELEASE_TAG}"
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while IFS= read -r TAG; do
            [[ -z "$TAG" || "$TAG" == "$CURRENT_TAG" ]] && continue
            echo "Deleting previous release: $TAG"
            gh release delete "$TAG" --yes
          done
