name: Release Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-trigger-v0.1.15'

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build universal Release DMG
        run: |
          chmod +x Scripts/package_release.sh
          Scripts/package_release.sh

      - name: Inspect package
        run: |
          ls -lh dist/MemWatch.dmg dist/MemWatch.dmg.sha256
          cat dist/MemWatch.dmg.sha256

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemWatch-macOS-ad-hoc
          path: |
            dist/MemWatch.dmg
            dist/MemWatch.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.15"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          MemWatch v0.1.15 makes Cleanup deletion scope explicit and translates the Cleanup interface to Turkish.

          Changes:
          - Cleanup interface is now Turkish, including categories, permissions, APFS storage, Time Machine, scan roots, ignore rules, history and item actions
          - Main cleanup action is explicitly labeled as safe-only and shows the exact SAFE byte total it will attempt to remove
          - SAFE items now show a filled green checkmark because they are automatically included in the main safe cleanup action
          - REVIEW items remain opt-in: the main safe-clean button never removes them; users must select them explicitly before the separate selected-items cleanup action appears
          - PROTECTED items show a lock and cannot be selected for cleanup
          - Added a visible "Ne silinecek?" explanation card and clearer confirmation dialogs
          - "Dry Run" is presented as "Silmeden Kontrol Et"
          - CI architecture checks now validate behavior instead of hard-coded English UI strings, so localization cannot break the safety contract

          This build is ad-hoc signed and has not yet been Apple-notarized. macOS Gatekeeper may require explicit approval on first launch.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/MemWatch.dmg dist/MemWatch.dmg.sha256 --clobber
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "MemWatch $TAG — Türkçe Cleanup ve Açık Silme Kapsamı" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "MemWatch $TAG — Türkçe Cleanup ve Açık Silme Kapsamı" \
              --notes-file /tmp/release-notes.md \
              --prerelease \
              dist/MemWatch.dmg \
              dist/MemWatch.dmg.sha256
          fi

      - name: Prune previous GitHub releases once
        if: github.ref_type != 'tag' && contains(github.event.head_commit.message, '[prune-releases]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TAG="v0.1.15"
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while IFS= read -r TAG; do
            [[ -z "$TAG" || "$TAG" == "$CURRENT_TAG" ]] && continue
            echo "Deleting previous release: $TAG"
            gh release delete "$TAG" --yes
          done
