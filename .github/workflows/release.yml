name: Release Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-trigger-v0.1.14'

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build universal Release DMG
        run: |
          chmod +x Scripts/package_release.sh
          Scripts/package_release.sh

      - name: Inspect package
        run: |
          ls -lh dist/MemWatch.dmg dist/MemWatch.dmg.sha256
          cat dist/MemWatch.dmg.sha256

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemWatch-macOS-ad-hoc
          path: |
            dist/MemWatch.dmg
            dist/MemWatch.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.14"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          MemWatch v0.1.14 makes Phase 8 Cleanup visible from the normal tray workflow.

          Changes:
          - Added a prominent Cleanup & Storage card to the normal left-click tray overview
          - The card opens the full Deep Cleanup window directly
          - Kept Cleanup & Storage available from the tray right-click menu as a secondary shortcut
          - Added a tray UX regression contract so the Cleanup entry cannot disappear from the normal overview again
          - Includes the full Phase 8 Deep Storage & Cleanup engine from v0.1.13: Safe / Review / Protected classification, developer/project/AI scanning, duplicates, large/old files, application leftovers, APFS intelligence, Full Disk Access, privileged helper, Time Machine maintenance, dry-run, history, ignore rules and deletion safety protections
          - macOS CI, Phase 8 Cleanup Validation and Universal Release DMG checks pass with the visible Cleanup entry

          This build is ad-hoc signed and has not yet been Apple-notarized. macOS Gatekeeper may require explicit approval on first launch.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/MemWatch.dmg dist/MemWatch.dmg.sha256 --clobber
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "MemWatch $TAG — Visible Cleanup UI" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "MemWatch $TAG — Visible Cleanup UI" \
              --notes-file /tmp/release-notes.md \
              --prerelease \
              dist/MemWatch.dmg \
              dist/MemWatch.dmg.sha256
          fi

      - name: Prune previous GitHub releases once
        if: github.ref_type != 'tag' && contains(github.event.head_commit.message, '[prune-releases]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TAG="v0.1.14"
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while IFS= read -r TAG; do
            [[ -z "$TAG" || "$TAG" == "$CURRENT_TAG" ]] && continue
            echo "Deleting previous release: $TAG"
            gh release delete "$TAG" --yes
          done
