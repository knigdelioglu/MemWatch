name: Release Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-trigger-v0.1.13'

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build universal Release DMG
        run: |
          chmod +x Scripts/package_release.sh
          Scripts/package_release.sh

      - name: Inspect package
        run: |
          ls -lh dist/MemWatch.dmg dist/MemWatch.dmg.sha256
          cat dist/MemWatch.dmg.sha256

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemWatch-macOS-ad-hoc
          path: |
            dist/MemWatch.dmg
            dist/MemWatch.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.13"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          MemWatch v0.1.13 delivers Phase 8 — Deep Storage & Cleanup.

          Highlights:
          - Dedicated on-demand cleanup flow kept separate from lightweight background monitoring
          - Rule-based user cache/log, developer cache, project artifact, Trash, download/installer, device-backup and AI storage scanning
          - Deep application-leftover, diagnostics, large/old-file, duplicate and similar-image analysis
          - Safe / Review / Protected classification with explicit selection semantics
          - Canonical-path, symlink, ownership, file-identity and TOCTOU protections before deletion
          - Ignore rules, cleanup history, dry-run and reclaimed-space verification
          - Full Disk Access and narrowly scoped privileged-helper capability states
          - System cleanup, Time Machine and purgeable-space maintenance through restricted backends
          - Cleanup, privileged-operation and private-backend kill switches
          - Cancellation and truthful progress reporting without adding recursive work to normal monitoring cadence
          - Phase 8 safety, persistence, helper, performance and Universal Release DMG validation gates passing on main

          This build is ad-hoc signed and has not yet been Apple-notarized. macOS Gatekeeper may require explicit approval on first launch.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/MemWatch.dmg dist/MemWatch.dmg.sha256 --clobber
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "MemWatch $TAG — Phase 8" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "MemWatch $TAG — Phase 8" \
              --notes-file /tmp/release-notes.md \
              --prerelease \
              dist/MemWatch.dmg \
              dist/MemWatch.dmg.sha256
          fi

      - name: Prune previous GitHub releases once
        if: github.ref_type != 'tag' && contains(github.event.head_commit.message, '[prune-releases]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TAG="v0.1.13"
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while IFS= read -r TAG; do
            [[ -z "$TAG" || "$TAG" == "$CURRENT_TAG" ]] && continue
            echo "Deleting previous release: $TAG"
            gh release delete "$TAG" --yes
          done
