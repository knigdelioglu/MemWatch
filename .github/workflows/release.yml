name: Release Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-trigger-v0.1.6'

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build universal Release DMG
        run: |
          chmod +x Scripts/package_release.sh
          Scripts/package_release.sh

      - name: Inspect package
        run: |
          ls -lh dist/MemWatch.dmg dist/MemWatch.dmg.sha256
          cat dist/MemWatch.dmg.sha256

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemWatch-macOS-ad-hoc
          path: |
            dist/MemWatch.dmg
            dist/MemWatch.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.6"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          MemWatch macOS Release Candidate popover layout fix.

          Changes in v0.1.6:
          - Fixed Dashboard and Memory detail cards being clipped horizontally
          - AppKit popover and SwiftUI content now use the same 430×640 panel size
          - Reopening MemWatch always starts on the Dashboard, even if a detail page was open before closing
          - Added CI regression coverage for panel-width parity and reopen reset behavior

          This build is ad-hoc signed and has not yet been Apple-notarized. macOS Gatekeeper may require explicit approval on first launch.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/MemWatch.dmg dist/MemWatch.dmg.sha256 --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "MemWatch $TAG — Release Candidate" \
              --notes-file /tmp/release-notes.md \
              --prerelease \
              dist/MemWatch.dmg \
              dist/MemWatch.dmg.sha256
          fi
