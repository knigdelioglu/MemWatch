name: macOS CI

on:
  push:
    branches:
      - main
      - sprint-1-core-memory
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Swift Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c debug
