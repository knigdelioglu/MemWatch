name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build MemWatch
        run: |
          xcodebuild \
            -project MemWatch.xcodeproj \
            -scheme MemWatch \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify menu-bar-only configuration
        run: |
          xcodebuild \
            -project MemWatch.xcodeproj \
            -scheme MemWatch \
            -configuration Debug \
            -showBuildSettings | grep 'INFOPLIST_KEY_LSUIElement = YES'
          grep -q 'setActivationPolicy(.accessory)' MemWatchApp.swift

      - name: Verify popover layout and reopen reset
        run: |
          grep -q 'panelSize = NSSize(width: 430, height: 640)' MemWatchApp.swift
          grep -q 'installDashboardRootView()' MemWatchApp.swift
          test "$(grep -c 'installDashboardRootView()' MemWatchApp.swift)" -ge 2
          grep -q '.frame(width: 430, height: 640)' Views/MenuBarView.swift
          ! grep -q 'NSSize(width: 380, height: 640)' MemWatchApp.swift

      - name: Run smart tray UX contract tests
        run: |
          xcrun swiftc \
            -parse-as-library \
            Tests/TrayUXContractTests.swift \
            -o /tmp/memwatch-tray-ux-tests
          /tmp/memwatch-tray-ux-tests

      - name: Run memory collector smoke test
        run: |
          xcrun swiftc \
            Models/MemorySnapshot.swift \
            Collectors/MemoryCollector.swift \
            Tests/MemoryCollectorSmoke.swift \
            -o /tmp/memwatch-collector-smoke
          /tmp/memwatch-collector-smoke

      - name: Run memory pressure estimate tests
        run: |
          xcrun swiftc \
            Models/MemorySnapshot.swift \
            Tests/MemoryPressureEstimateTests.swift \
            -o /tmp/memwatch-pressure-estimate-tests
          /tmp/memwatch-pressure-estimate-tests

      - name: Run storage collector smoke test
        run: |
          xcrun swiftc \
            Models/StorageSnapshot.swift \
            Collectors/StorageCollector.swift \
            Tests/StorageCollectorSmoke.swift \
            -o /tmp/memwatch-storage-collector-smoke
          /tmp/memwatch-storage-collector-smoke

      - name: Run storage disk-image filtering tests
        run: |
          xcrun swiftc \
            Models/StorageSnapshot.swift \
            Collectors/StorageCollector.swift \
            Tests/StorageVolumeFilteringTests.swift \
            -o /tmp/memwatch-storage-filter-tests
          /tmp/memwatch-storage-filter-tests

      - name: Run APFS storage intelligence tests
        run: |
          xcrun swiftc \
            Models/StorageSnapshot.swift \
            Tests/StorageSpaceIntelligenceTests.swift \
            -o /tmp/memwatch-storage-space-tests
          /tmp/memwatch-storage-space-tests

      - name: Run power model tests
        run: |
          xcrun swiftc \
            Models/PowerSnapshot.swift \
            Tests/PowerSnapshotTests.swift \
            -o /tmp/memwatch-power-model-tests
          /tmp/memwatch-power-model-tests

      - name: Run power collector smoke test
        run: |
          xcrun swiftc \
            Models/PowerSnapshot.swift \
            Collectors/PowerCollector.swift \
            Tests/PowerCollectorSmoke.swift \
            -framework IOKit \
            -o /tmp/memwatch-power-collector-smoke
          /tmp/memwatch-power-collector-smoke

      - name: Run system diagnostics collector smoke test
        run: |
          xcrun swiftc \
            Models/SystemDiagnosticsSnapshot.swift \
            Collectors/SystemDiagnosticsCollector.swift \
            Tests/SystemDiagnosticsCollectorSmoke.swift \
            -framework AppKit \
            -o /tmp/memwatch-system-diagnostics-smoke
          /tmp/memwatch-system-diagnostics-smoke

      - name: Verify settings integrations
        run: |
          grep -q 'SMAppService.mainApp' Services/LaunchAtLoginService.swift
          grep -q 'case .notFound:' Services/LaunchAtLoginService.swift
          grep -q 'return .needsSetup' Services/LaunchAtLoginService.swift
          grep -q 'Open Login Items Settings' Views/SystemDiagnosticsView.swift
          grep -q 'Open Notification Settings' Views/MenuBarView.swift
          ! grep -q 'Fan telemetry' Views/SystemDiagnosticsView.swift

      - name: Run swap intelligence tests
        run: |
          xcrun swiftc \
            Models/MemorySnapshot.swift \
            Services/SwapIntelligenceEngine.swift \
            Tests/SwapIntelligenceTests.swift \
            -o /tmp/memwatch-swap-intelligence-tests
          /tmp/memwatch-swap-intelligence-tests

      - name: Run memory notification policy tests
        run: |
          xcrun swiftc \
            Models/MemorySnapshot.swift \
            Services/SwapIntelligenceEngine.swift \
            Services/NotificationPolicyEngine.swift \
            Tests/NotificationPolicyTests.swift \
            -o /tmp/memwatch-notification-policy-tests
          /tmp/memwatch-notification-policy-tests

      - name: Run storage notification policy tests
        run: |
          xcrun swiftc \
            Models/StorageSnapshot.swift \
            Services/StorageNotificationPolicyEngine.swift \
            Tests/StorageNotificationPolicyTests.swift \
            -o /tmp/memwatch-storage-policy-tests
          /tmp/memwatch-storage-policy-tests

      - name: Run cleanup safety policy tests
        run: |
          xcrun swiftc \
            -parse-as-library \
            Models/CleanupModels.swift \
            Cleanup/Core/CleanupRuleCatalog.swift \
            Cleanup/Core/CleanupPathValidator.swift \
            Cleanup/Core/CleanupSafetyEngine.swift \
            Cleanup/Core/CleanupScanner.swift \
            Cleanup/Core/DeveloperProjectDiscovery.swift \
            Cleanup/Core/CargoMetadataResolver.swift \
            Cleanup/Core/DeveloperBuildActivityGuard.swift \
            Cleanup/Core/DeveloperBuildArtifactScanner.swift \
            Cleanup/Core/CleanupFileSizer.swift \
            Tests/CleanupSafetyTests.swift \
            -framework AppKit \
            -framework Vision \
            -framework ImageIO \
            -o /tmp/memwatch-cleanup-safety-tests
          /tmp/memwatch-cleanup-safety-tests

      - name: Run cleanup scanner behavior tests
        run: |
          xcrun swiftc \
            -parse-as-library \
            Models/CleanupModels.swift \
            Cleanup/Core/CleanupRuleCatalog.swift \
            Cleanup/Core/CleanupPathValidator.swift \
            Cleanup/Core/CleanupScanner.swift \
            Cleanup/Core/DeveloperProjectDiscovery.swift \
            Cleanup/Core/CargoMetadataResolver.swift \
            Cleanup/Core/DeveloperBuildActivityGuard.swift \
            Cleanup/Core/DeveloperBuildArtifactScanner.swift \
            Cleanup/Core/CleanupFileSizer.swift \
            Tests/CleanupScannerBehaviorTests.swift \
            -framework AppKit \
            -framework Vision \
            -framework ImageIO \
            -o /tmp/memwatch-cleanup-scanner-tests
          /tmp/memwatch-cleanup-scanner-tests

      - name: Run cleanup scanner fixture tests
        run: |
          xcrun swiftc \
            -parse-as-library \
            Models/CleanupModels.swift \
            Cleanup/Core/CleanupRuleCatalog.swift \
            Cleanup/Core/CleanupPathValidator.swift \
            Cleanup/Core/CleanupSafetyEngine.swift \
            Cleanup/Core/CleanupScanner.swift \
            Cleanup/Core/DeveloperProjectDiscovery.swift \
            Cleanup/Core/CargoMetadataResolver.swift \
            Cleanup/Core/DeveloperBuildActivityGuard.swift \
            Cleanup/Core/DeveloperBuildArtifactScanner.swift \
            Cleanup/Core/CleanupFileSizer.swift \
            Tests/CleanupScannerFixtureTests.swift \
            -framework AppKit \
            -framework CoreGraphics \
            -framework ImageIO \
            -framework Vision \
            -o /tmp/memwatch-cleanup-scanner-fixture-tests
          /tmp/memwatch-cleanup-scanner-fixture-tests

      - name: Run Cargo build artifact verification tests
        run: |
          xcrun swiftc \
            -parse-as-library \
            Models/CleanupModels.swift \
            Cleanup/Core/CleanupRuleCatalog.swift \
            Cleanup/Core/CleanupPathValidator.swift \
            Cleanup/Core/CleanupSafetyEngine.swift \
            Cleanup/Core/CleanupScanner.swift \
            Cleanup/Core/DeveloperProjectDiscovery.swift \
            Cleanup/Core/CargoMetadataResolver.swift \
            Cleanup/Core/DeveloperBuildActivityGuard.swift \
            Cleanup/Core/DeveloperBuildArtifactScanner.swift \
            Cleanup/Core/CleanupFileSizer.swift \
            Tests/DeveloperBuildArtifactTests.swift \
            -framework AppKit \
            -framework CoreGraphics \
            -framework ImageIO \
            -framework Vision \
            -o /tmp/memwatch-cargo-artifact-tests
          /tmp/memwatch-cargo-artifact-tests

      - name: Run cleanup scan cancellation tests
        run: |
          xcrun swiftc \
            -parse-as-library \
            Models/CleanupModels.swift \
            Cleanup/Core/CleanupRuleCatalog.swift \
            Cleanup/Core/CleanupPathValidator.swift \
            Cleanup/Core/CleanupSafetyEngine.swift \
            Cleanup/Core/CleanupScanner.swift \
            Cleanup/Core/DeveloperProjectDiscovery.swift \
            Cleanup/Core/CargoMetadataResolver.swift \
            Cleanup/Core/DeveloperBuildActivityGuard.swift \
            Cleanup/Core/DeveloperBuildArtifactScanner.swift \
            Cleanup/Core/CleanupFileSizer.swift \
            Cleanup/Core/CleanupScanEngine.swift \
            Tests/CleanupCancellationTests.swift \
            -framework AppKit \
            -framework Vision \
            -framework ImageIO \
            -o /tmp/memwatch-cleanup-cancellation-tests
          /tmp/memwatch-cleanup-cancellation-tests

      - name: Run cleanup scan coalescing tests
        run: |
          xcrun swiftc \
            -parse-as-library \
            Models/CleanupModels.swift \
            Cleanup/Core/CleanupRuleCatalog.swift \
            Cleanup/Core/CleanupPathValidator.swift \
            Cleanup/Core/CleanupSafetyEngine.swift \
            Cleanup/Core/CleanupScanner.swift \
            Cleanup/Core/DeveloperProjectDiscovery.swift \
            Cleanup/Core/CargoMetadataResolver.swift \
            Cleanup/Core/DeveloperBuildActivityGuard.swift \
            Cleanup/Core/DeveloperBuildArtifactScanner.swift \
            Cleanup/Core/CleanupFileSizer.swift \
            Cleanup/Core/CleanupScanEngine.swift \
            Tests/CleanupScanEngineTests.swift \
            -framework AppKit \
            -framework Vision \
            -framework ImageIO \
            -o /tmp/memwatch-cleanup-scan-engine-tests
          /tmp/memwatch-cleanup-scan-engine-tests

      - name: Run cleanup deletion and TOCTOU tests
        run: |
          xcrun swiftc \
            -parse-as-library \
            Models/CleanupModels.swift \
            Cleanup/Core/CleanupRuleCatalog.swift \
            Cleanup/Core/CleanupPathValidator.swift \
            Cleanup/Core/CleanupSafetyEngine.swift \
            Cleanup/Core/CleanupScanner.swift \
            Cleanup/Core/DeveloperProjectDiscovery.swift \
            Cleanup/Core/CargoMetadataResolver.swift \
            Cleanup/Core/DeveloperBuildActivityGuard.swift \
            Cleanup/Core/DeveloperBuildArtifactScanner.swift \
            Cleanup/Core/CleanupFileSizer.swift \
            PrivilegedHelper/HelperProtocol.swift \
            Cleanup/Core/CleanupSecureRemoval.swift \
            Cleanup/Core/CleanupDeletionEngine.swift \
            Tests/CleanupDeletionTests.swift \
            -framework AppKit \
            -framework Vision \
            -framework ImageIO \
            -framework Security \
            -o /tmp/memwatch-cleanup-deletion-tests
          /tmp/memwatch-cleanup-deletion-tests

      - name: Run cleanup persistence migration tests
        run: |
          xcrun swiftc \
            -parse-as-library \
            Models/CleanupModels.swift \
            Cleanup/Core/CleanupRuleCatalog.swift \
            Cleanup/Core/CleanupPathValidator.swift \
            Cleanup/Core/CleanupSafetyEngine.swift \
            Cleanup/Core/CleanupScanner.swift \
            Cleanup/Core/DeveloperProjectDiscovery.swift \
            Cleanup/Core/CargoMetadataResolver.swift \
            Cleanup/Core/DeveloperBuildActivityGuard.swift \
            Cleanup/Core/DeveloperBuildArtifactScanner.swift \
            Cleanup/Core/CleanupFileSizer.swift \
            PrivilegedHelper/HelperProtocol.swift \
            Cleanup/Core/CleanupSecureRemoval.swift \
            Cleanup/Core/CleanupDeletionEngine.swift \
            Cleanup/Persistence/CleanupStores.swift \
            Tests/CleanupPersistenceMigrationTests.swift \
            -framework AppKit \
            -framework Vision \
            -framework ImageIO \
            -framework Security \
            -o /tmp/memwatch-cleanup-persistence-tests
          /tmp/memwatch-cleanup-persistence-tests

      - name: Run privileged helper protocol tests
        run: |
          xcrun swiftc \
            -parse-as-library \
            PrivilegedHelper/HelperProtocol.swift \
            Tests/PrivilegedHelperProtocolTests.swift \
            -framework Security \
            -o /tmp/memwatch-helper-protocol-tests
          /tmp/memwatch-helper-protocol-tests

      - name: Run privileged helper installer script tests
        run: |
          xcrun swiftc \
            -parse-as-library \
            Services/PrivilegedHelperInstallerScript.swift \
            Tests/PrivilegedHelperInstallerScriptTests.swift \
            -o /tmp/memwatch-helper-installer-tests
          /tmp/memwatch-helper-installer-tests

      - name: Verify cleanup architecture contracts
        run: |
          grep -q 'Deep Cleanup' MemWatchApp.swift
          grep -Fq 'private var cleanupWindowController: NSWindowController?' MemWatchApp.swift
          grep -q 'setCleanupEnabled' Services/CleanupCoordinator.swift
          grep -q 'setPrivilegedOperationsEnabled' Services/CleanupCoordinator.swift
          grep -q 'setPrivateBackendEnabled' Services/CleanupCoordinator.swift
          grep -q 'CleanupScannerID(rawValue: "privileged-system")' Services/CleanupCoordinator.swift
          grep -q 'PrivilegedSystemScanner()' Cleanup/Core/CleanupScanEngine.swift
          grep -q 'SecCodeCopyStaticCode' PrivilegedHelper/HelperProtocol.swift
          grep -q 'PrivilegedHelperAuthorizationManifest' PrivilegedHelper/HelperProtocol.swift
          grep -q 'authorizationManifestPath' PrivilegedHelper/HelperProtocol.swift
          grep -q 'isSecureManifestFile' PrivilegedHelper/HelperMain.swift
          grep -q 'SMAppService.daemon' Services/PrivilegedHelperService.swift
          grep -q 'case .adHoc' Services/PrivilegedHelperService.swift
          grep -q 'case .smAppService' Services/PrivilegedHelperService.swift
          grep -q 'set -e' Services/PrivilegedHelperInstallerScript.swift
          grep -q "run_step 'launchctl bootstrap'" Services/PrivilegedHelperInstallerScript.swift
          ! grep -q 'joined(separator: "; ")' Services/PrivilegedHelperService.swift
          grep -q 'openSystemSettingsLoginItems' Services/PrivilegedHelperService.swift
          grep -q 'Contents/Library/HelperTools' MemWatch.xcodeproj/project.pbxproj
          grep -q 'Contents/Library/LaunchDaemons' MemWatch.xcodeproj/project.pbxproj
          grep -q 'coordinator.preferences.cleanupEnabled' Views/CleanupView.swift
          grep -q 'coordinator.preferences.privilegedOperationsEnabled' Views/CleanupView.swift
          grep -q 'coordinator.preferences.privateBackendEnabled' Views/CleanupView.swift
          grep -q 'purgeableEstimateBytes' Views/CleanupView.swift
          ! grep -q 'func delete(path:' PrivilegedHelper/HelperProtocol.swift
          ! grep -q 'rm -rf' PrivilegedHelper/HelperMain.swift

      - name: Run collector performance budgets
        run: |
          xcrun swiftc \
            Models/MemorySnapshot.swift \
            Collectors/MemoryCollector.swift \
            Models/PowerSnapshot.swift \
            Collectors/PowerCollector.swift \
            Models/SystemDiagnosticsSnapshot.swift \
            Collectors/SystemDiagnosticsCollector.swift \
            Tests/CollectorPerformanceTests.swift \
            -framework IOKit \
            -framework AppKit \
            -o /tmp/memwatch-performance-tests
          /tmp/memwatch-performance-tests

      - name: Run background cadence battery-impact guard
        run: |
          xcrun swiftc \
            -parse-as-library \
            Tests/BackgroundCadenceTests.swift \
            -o /tmp/memwatch-cadence-tests
          /tmp/memwatch-cadence-tests

      - name: Build and verify universal Release DMG
        run: |
          chmod +x Scripts/package_release.sh
          Scripts/package_release.sh
          test -s dist/MemWatch.dmg
          test -s dist/MemWatch.dmg.sha256

      - name: Upload verified DMG
        uses: actions/upload-artifact@v4
        with:
          name: MemWatch-macOS-ad-hoc
          path: |
            dist/MemWatch.dmg
            dist/MemWatch.dmg.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Print reference system metrics
        run: |
          echo '--- vm_stat ---'
          vm_stat
          echo '--- swapusage ---'
          sysctl vm.swapusage
          echo '--- mounted volumes ---'
          df -h
          echo '--- disk images ---'
          hdiutil info || true
          echo '--- power source ---'
          pmset -g batt || true
          echo '--- power adapter / battery registry ---'
          ioreg -rn AppleSmartBattery -r -l | head -n 120 || true
          echo '--- thermal / power mode ---'
          pmset -g custom || true
